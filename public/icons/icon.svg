<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <radialGradient id="glowTop" cx="75%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#2563eb" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Border highlight -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Emblem Gradients -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="topFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="botFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="60%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>

    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0284c7" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#ea580c" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base App Tile (Squircle with 112px radius) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="112" fill="url(#glowTop)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- Blueprint Subtle Grid Accent in background -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1.5">
    <line x1="64" y1="0" x2="64" y2="512"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="192" y1="0" x2="192" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="320" y1="0" x2="320" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="448" y1="0" x2="448" y2="512"/>
    <line x1="0" y1="64" x2="512" y2="64"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="192" x2="512" y2="192"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="320" x2="512" y2="320"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="0" y1="448" x2="512" y2="448"/>
  </g>

  <!-- Central "Buildora Monogram" Emblem with 3D Architectural Facets -->
  <g filter="url(#softShadow)">
    <!-- Vertical Backbone Pillar (The I-Beam spine of the "B") -->
    <rect x="116" y="108" width="68" height="296" rx="18" fill="url(#stemGrad)"/>
    <!-- Pillar highlight line -->
    <rect x="124" y="116" width="10" height="280" rx="5" fill="#ffffff" opacity="0.35"/>

    <!-- Precision Drafting Ticks on the spine -->
    <g fill="#ffffff" opacity="0.45">
      <rect x="168" y="148" width="12" height="4" rx="2"/>
      <rect x="164" y="180" width="16" height="4" rx="2"/>
      <rect x="168" y="212" width="12" height="4" rx="2"/>
      <rect x="164" y="244" width="16" height="4" rx="2"/>
      <rect x="168" y="276" width="12" height="4" rx="2"/>
      <rect x="164" y="308" width="16" height="4" rx="2"/>
      <rect x="168" y="340" width="12" height="4" rx="2"/>
    </g>

    <!-- Top Loop of the "B": Precision Beveled Arch -->
    <path d="M 184 108 
             H 292 
             C 352 108, 394 142, 394 196 
             C 394 246, 354 274, 298 276 
             H 184 
             Z" 
          fill="url(#topFacet)"/>

    <!-- Top Loop Negative Space (Inner Cutout) -->
    <path d="M 228 160 
             H 284 
             C 316 160, 336 174, 336 198 
             C 336 222, 316 234, 284 234 
             H 228 
             Z" 
          fill="#0a101f"/>

    <!-- Bottom Loop of the "B": Structural Foundation Prism -->
    <path d="M 184 252 
             H 308 
             C 374 252, 420 290, 420 350 
             C 420 404, 368 404, 308 404 
             H 184 
             Z" 
          fill="url(#botFacet)"/>

    <!-- Bottom Loop Negative Space (Inner Cutout) -->
    <path d="M 232 298 
             H 298 
             C 334 298, 358 314, 358 348 
             C 358 372, 334 378, 298 378 
             H 232 
             Z" 
          fill="#0a101f"/>

    <!-- Specular Highlight Sheen on Top Loop -->
    <path d="M 184 108 H 292 C 348 108 386 138 392 188 C 378 148 338 126 280 126 H 184 Z" 
          fill="url(#innerGlow)"/>

    <!-- Specular Highlight on Bottom Loop Shelf -->
    <path d="M 184 252 H 308 C 364 252 406 278 416 332 C 404 290 358 268 296 268 H 184 Z" 
          fill="url(#innerGlow)" opacity="0.6"/>
  </g>

  <!-- Golden Drafting Angle / Precision Square Accent Marker (Symbolizing calculation & trade craft) -->
  <g filter="url(#badgeShadow)">
    <polygon points="340,78 404,142 376,170 340,134 304,170 276,142" fill="url(#accentOrange)"/>
    <polygon points="340,102 380,142 366,156 340,130 314,156 300,142" fill="#fed7aa"/>
  </g>
</svg>
