version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # Group all non-breaking patch/minor updates into a single PR to reduce noise.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Always review these individually — they touch HTML rendering or the
    # request path, and a malicious version is a supply-chain vector.
    ignore: []
